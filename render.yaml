services:
  - type: web
    name: nexora-myanmar-recap-bot
    runtime: python
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:web_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ERROR_REPORT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: CHATGPT_BRIDGE_API_KEY
        sync: false
      - key: NEXORA_CONSOLE_PASSWORD
        sync: false
      - key: CHATGPT_BRIDGE_CHAT_ID
        sync: false
      - key: TMDB_API_READ_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_RESEARCH_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
