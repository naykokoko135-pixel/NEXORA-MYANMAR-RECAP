# OPTIONAL paid blueprint: adds a persistent disk so voice profiles survive restarts. Deploy only if you approve billing.
services:
  - type: web
    name: nexora-myanmar-recap-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m nexora.bot
    healthCheckPath: /health
    disk: { name: nexora-data, mountPath: /var/data, sizeGB: 1 }
    envVars:
      - { key: DATA_DIR, value: /var/data }
      - { key: VOICE_PROFILE_DB_PATH, value: /var/data/voices }
      - { key: TELEGRAM_BOT_TOKEN, sync: false }
      - { key: GH_TOKEN, sync: false }
      - { key: GH_REPO, value: naykokoko135-pixel/NEXORA-MYANMAR-RECAP }
      - { key: WEBHOOK_SECRET, generateValue: true }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: TMDB_API_KEY, sync: false }
      - { key: NEXORA_ADMIN_PASSWORD, sync: false }
      - { key: OPENAI_API_KEY, sync: false }
      - { key: TELEGRAM_CHAT_ID, sync: false }
      - { key: NEXORA_CRON_TOKEN, sync: false }
