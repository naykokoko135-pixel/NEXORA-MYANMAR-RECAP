name: Daily NEXORA Auto Research

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-daily-auto
  cancel-in-progress: false

jobs:
  daily-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run daily source research and Telegram delivery
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CHANNEL_URL: ${{ vars.YOUTUBE_CHANNEL_URL }}
          FACEBOOK_PAGE_URL: ${{ vars.FACEBOOK_PAGE_URL }}
          NEXORA_DAILY_RECAP_URL: ${{ vars.NEXORA_DAILY_RECAP_URL }}
          NEXORA_DAILY_RECAP_TOKEN: ${{ secrets.NEXORA_DAILY_RECAP_TOKEN }}
        run: python daily_auto.py
