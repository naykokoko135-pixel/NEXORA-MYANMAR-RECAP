name: Manual Production Pipeline Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-production-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate real Burmese MP3, aligned SRT, and MP4
        run: python smoke_production_pipeline.py
      - name: Upload smoke-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexora-production-smoke-artifacts
          path: production-smoke-artifacts/
          if-no-files-found: error
          retention-days: 3
