name: Studio Tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and espeak-ng
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: python -m pip install -r requirements.txt
      - name: Studio tests
        run: python -m pytest studio_tests -q
      - name: JS syntax check
        run: for f in $(find studio/static/js -name '*.js'); do node --check "$f" || exit 1; done
